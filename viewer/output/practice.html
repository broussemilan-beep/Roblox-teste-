<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visionneuse R6</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #15171c; --muted: #5d6573; --line: #d9dde4;
    --accent: #2f6fdd; --accent-text: #ffffff; --ground: #e9ecf1; --grid: #cfd5de;
    --warn: #b26a00; --err: #c0262d; --ok: #1f8a4c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --panel: #181b21; --text: #eceef2; --muted: #9aa3b2; --line: #2a2f38;
      --accent: #6a9bff; --accent-text: #0b0d12; --ground: #1d2129; --grid: #2f3541;
      --warn: #e0a64a; --err: #ff7b82; --ok: #5ccf8e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --panel: #181b21; --text: #eceef2; --muted: #9aa3b2; --line: #2a2f38;
    --accent: #6a9bff; --accent-text: #0b0d12; --ground: #1d2129; --grid: #2f3541;
    --warn: #e0a64a; --err: #ff7b82; --ok: #5ccf8e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 1.25rem; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 12px; font-size: .9rem; }
  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  canvas { display: block; width: 100%; aspect-ratio: 16 / 9; background: #111; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
  button, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); min-width: 92px; font-weight: 600; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  label { color: var(--muted); font-size: .88rem; display: inline-flex; gap: 6px; align-items: center; }
  .scrub { position: relative; flex: 1 1 100%; padding-top: 18px; }
  .scrub input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }
  .ticks { position: absolute; left: 8px; right: 8px; top: 0; height: 16px; pointer-events: none; font-size: 11px; color: var(--muted); }
  .tick { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .tick::after { content: ""; display: block; width: 1px; height: 5px; background: var(--muted); margin: 0 auto; }
  .tick.act { color: var(--text); font-weight: 600; }
  .tick.act::after { height: 8px; background: var(--accent); width: 2px; }
  .hitband { position: absolute; top: 12px; height: 4px; background: var(--warn); opacity: .55; border-radius: 2px; }
  .readout { font-variant-numeric: tabular-nums; color: var(--muted); margin-left: auto; }
  .readout b { color: var(--text); }
  details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-top: 12px; padding: 8px 12px; }
  summary { cursor: pointer; font-weight: 600; }
  ul.f { margin: 8px 0 2px; padding-left: 18px; }
  ul.f li { margin: 4px 0; }
  .sev-error { color: var(--err); font-weight: 600; } .sev-warning { color: var(--warn); font-weight: 600; } .sev-info { color: var(--muted); font-weight: 600; }
  .hint { color: var(--muted); font-size: .85rem; margin-top: 10px; }
  @media (max-width: 560px) { main { padding-block: 12px; } .readout { margin-left: 0; flex: 1 1 100%; } }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <div class="stage">
    <canvas id="cv" role="img" aria-label="Visionneuse 3D des personnages R6"></canvas>
    <div class="bar">
      <button id="play" class="primary" aria-label="Lecture / pause">Pause</button>
      <label>Vitesse
        <select id="speed">
          <option value="1">1× (60 fps)</option><option value="0.5">0,5×</option>
          <option value="0.25">0,25×</option><option value="0.1">0,1×</option>
        </select></label>
      <label>Caméra
        <select id="cam"></select></label>
      <label><input type="checkbox" id="trail" checked> Trajectoire du poing</label>
      <span class="readout" id="readout"></span>
      <div class="scrub">
        <div class="ticks" id="ticks"></div>
        <input type="range" id="scrub" min="0" value="0" step="1" aria-label="Image courante">
      </div>
    </div>
  </div>
  <p class="hint">Glisser pour tourner (passe en caméra libre) · molette pour zoomer · Espace : lecture · ← → : image par image</p>
  <div id="findings"></div>
</main>

        const off = (rnd() - 0.5) * H * 1.3, wd = H * (0.002 + rnd() * rnd() * (sf.thick == null ? 0.05 : sf.thick)), len = W * 1.6;
        const px = W / 2 - Math.sin(ang) * off, py = H / 2 + Math.cos(ang) * off;
        if (hx != null) { const dd = Math.abs(-Math.sin(ang) * (hx - px) + Math.cos(ang) * (hy - py)); if (dd < H * (sf.avoidR || 0.2)) continue; }
        ctx.strokeStyle = i % 3 === 2 ? '#0a0a0c' : '#f4f4f6'; ctx.globalAlpha = sf.alpha == null ? 0.9 : sf.alpha; ctx.lineWidth = wd;
        ctx.beginPath(); ctx.moveTo(px - Math.cos(ang) * len / 2, py - Math.sin(ang) * len / 2); ctx.lineTo(px + Math.cos(ang) * len / 2, py + Math.sin(ang) * len / 2); ctx.stroke();
      }
      ctx.restore(); return;
    }
    if (sf.kind === 'bw') {      // manga impact frame: hard threshold of the live frame + black shards (+ coloured hatching)
      if (!window.__tmp) window.__tmp = document.createElement('canvas');
      const tmp = window.__tmp; tmp.width = W; tmp.height = H; tmp.getContext('2d').drawImage(cv, 0, 0);
      ctx.save(); ctx.fillStyle = sf.bg || (sf.dark ? '#000' : '#fff'); ctx.fillRect(0, 0, W, H); ctx.filter = sf.bfirst ? `grayscale(1) brightness(${sf.bright || 1.25}) contrast(${sf.contrast || 14})` : `grayscale(1) contrast(${sf.contrast || 14}) brightness(${sf.bright || 1.25})`; ctx.globalAlpha = sf.keep == null ? 1 : sf.keep; ctx.drawImage(tmp, 0, 0); ctx.restore();
      if (sf.multiply) { ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = sf.multiply; ctx.fillRect(0, 0, W, H); ctx.restore(); }
      const shard = sf.dark ? '#fff' : '#000';
      for (let i = 0; i < (sf.shards == null ? 16 : sf.shards); i++) { const a = rnd() * Math.PI * 2, r0 = H * (0.18 + rnd() * 0.5), len = H * (0.25 + rnd() * 0.8), wd = H * (0.02 + rnd() * 0.07);
        ctx.fillStyle = shard; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.lineTo(cx + Math.cos(a + wd / r0) * (r0 + len * 0.4), cy + Math.sin(a + wd / r0) * (r0 + len * 0.4));
        ctx.lineTo(cx + Math.cos(a) * (r0 + len), cy + Math.sin(a) * (r0 + len)); ctx.lineTo(cx + Math.cos(a - wd / r0) * (r0 + len * 0.3), cy + Math.sin(a - wd / r0) * (r0 + len * 0.3)); ctx.closePath(); ctx.fill(); }
      for (let i = 0; i < (sf.prisms || 0); i++) { const a = rnd() * Math.PI * 2, r = H * (0.05 + rnd() * 0.32), w = H * (0.03 + rnd() * 0.07), h2 = w * (0.5 + rnd() * 1.4);
        ctx.save(); ctx.translate(cx + Math.cos(a) * r * 1.3, cy + Math.sin(a) * r); ctx.rotate(rnd() * Math.PI); ctx.fillStyle = i % 4 === 3 ? '#ffe24a' : '#00f2ff'; ctx.fillRect(-w / 2, -h2 / 2, w, h2); ctx.restore(); }
      if (sf.accent) { ctx.lineCap = 'round'; for (let i = 0; i < 70; i++) { const a = rnd() * Math.PI * 2, r0 = H * (0.05 + rnd() * 0.18), r1 = r0 + H * (0.05 + rnd() * 0.18);
        ctx.strokeStyle = ['#ff2a1a', '#ff8a1a', '#ffd21a'][i % 3]; ctx.lineWidth = (1 + rnd() * 2.5) * dpr; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0 * 0.8); ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1 * 0.8); ctx.stroke(); } }
      return;
    }
  }

  function drawScreen(S, f) {
    for (const sf of (S.fx || [])) { const u = (f - sf.t0) / sf.dur; if (u >= 0 && u < 1) screenFx(sf, u, f); }
    const vg = S.vignette[f], tint = S.tint[f], bars = S.bars[f], speed = S.speed[f];
    if (tint > 0.001) { ctx.fillStyle = rgba(hex(S.tintColor), tint); ctx.fillRect(0, 0, W, H); }
    if (speed > 0.01) {
      const rnd = mulberry32(Math.floor(f / 2) * 7919 + 13), cx = W / 2, cy = H / 2, n = 90;
      ctx.lineCap = 'round';
      for (let i = 0; i < n; i++) {
        const a = rnd() * Math.PI * 2, r0 = H * (0.32 + rnd() * 0.25), r1 = H * (0.75 + rnd() * 0.5);
        ctx.strokeStyle = `rgba(255,255,255,${(speed * (0.25 + rnd() * 0.5)).toFixed(3)})`; ctx.lineWidth = (1 + rnd() * 2.5) * dpr;
        ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.stroke();
      }
    }
    if (vg > 0.001) { const g = ctx.createRadialGradient(W/2, H/2, H * 0.3, W/2, H/2, H * 1.0); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${vg})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
    for (const fl of S.flashes) { const u = (f - fl.t0) / fl.dur; if (u < 0 || u > 1) continue; ctx.fillStyle = rgba(hex(fl.color), fl.peak * Math.pow(1 - u, 1.6)); ctx.fillRect(0, 0, W, H); }
    if (bars > 0.001) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H * bars); ctx.fillRect(0, H * (1 - bars), W, H * bars); }
  }

  function hud(f) {
    const labels = [];
    for (const m of (D.markers || [])) if (m.f === f || (m.hold && f >= m.f && f < m.f + m.hold)) labels.push(m.label);
    for (const b of (D.bands || [])) if (f >= b.f0 && f <= b.f1) labels.push(b.label);
    let label = labels.join(' · ');
    ctx.font = `600 ${14*dpr}px system-ui, sans-serif`; ctx.textBaseline = 'top';
    if (label) { label = label.toUpperCase(); const w = ctx.measureText(label).width + 20*dpr; ctx.fillStyle = css('--warn'); ctx.fillRect(12*dpr, 12*dpr, w, 26*dpr); ctx.fillStyle = '#000'; ctx.fillText(label, 22*dpr, 17*dpr); }
    $('readout').innerHTML = `image <b>${f}</b> / ${D.nFrames - 1} · ${(f / D.fps).toFixed(2).replace('.', ',')} s`;
    $('scrub').value = f;
  }

  // ------------------------------------------------------------------ UI
  function buildTicks() {
    const el = $('ticks'); el.innerHTML = ''; const max = D.nFrames - 1;
    for (const m of (D.markers || [])) { const d = document.createElement('div'); d.className = 'tick' + (m.act ? ' act' : ''); d.style.left = (m.f / max * 100) + '%'; d.textContent = m.label; el.appendChild(d); }
    for (const b of (D.bands || [])) if (b.show !== false) { const d = document.createElement('div'); d.className = 'hitband'; d.style.left = (b.f0 / max * 100) + '%'; d.style.width = ((b.f1 - b.f0) / max * 100) + '%'; el.appendChild(d); }
  }
  function buildFindings() {
    const host = $('findings'); host.innerHTML = '';
    for (const ch of D.characters) {
      const d = document.createElement('details'); const s = document.createElement('summary');
      const n = ch.findings.length; s.textContent = `Analyse (linter) — ${ch.name} : ${n ? n + ' remarque(s)' : 'rien à signaler'}`;
      d.appendChild(s);
      if (n) { const ul = document.createElement('ul'); ul.className = 'f';
        for (const f of ch.findings) { const li = document.createElement('li');
          li.innerHTML = `<span class="sev-${f.severity}">${f.severity}</span> ${f.code} <em>(${f.confidence})</em>${f.frames ? ' [images ' + f.frames[0] + '–' + f.frames[1] + ']' : ''} — `;
          li.appendChild(document.createTextNode(f.message)); ul.appendChild(li); }
        d.appendChild(ul); }
      host.appendChild(d);
    }
  }
  function setPlaying(v) { st.playing = v; $('play').textContent = v ? 'Pause' : 'Lecture'; st.last = 0; }
  function toFree() {
    if (camMode !== 'film') return;
    const cs = filmState(st.frame), d = sub(cs.pos, cs.tgt), dist = len(d);
    free = { yaw: Math.atan2(d[0], d[2]) * 180 / Math.PI, pitch: clamp(Math.asin(d[1] / dist) * 180 / Math.PI, -5, 88), dist, target: cs.tgt };
    camMode = 'free'; camSel.value = 'free';
  }
  $('play').onclick = () => setPlaying(!st.playing);
  $('speed').onchange = (e) => { st.speed = +e.target.value; };
  camSel.onchange = (e) => { camMode = e.target.value; if (PRESETS[camMode]) free = { ...PRESETS[camMode] }; draw(); };
  $('trail').onchange = draw;
  $('scrub').max = D.nFrames - 1;
  $('scrub').oninput = (e) => { setPlaying(false); st.frame = +e.target.value; draw(); };
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'SELECT') return;
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!st.playing); }
    if (e.code === 'ArrowRight') { setPlaying(false); st.frame = Math.min(D.nFrames - 1, st.frame + 1); draw(); }
    if (e.code === 'ArrowLeft') { setPlaying(false); st.frame = Math.max(0, st.frame - 1); draw(); }
  });
  let drag = null;
  cv.addEventListener('pointerdown', (e) => { toFree(); drag = { x: e.clientX, y: e.clientY, yaw: free.yaw, pitch: free.pitch }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', (e) => { if (!drag) return; free.yaw = drag.yaw - (e.clientX - drag.x) * 0.4; free.pitch = clamp(drag.pitch + (e.clientY - drag.y) * 0.3, -5, 88); draw(); });
  cv.addEventListener('pointerup', () => { drag = null; });
  cv.addEventListener('wheel', (e) => { e.preventDefault(); toFree(); free.dist = clamp(free.dist * (e.deltaY > 0 ? 1.08 : 0.92), 3, 80); draw(); }, { passive: false });
  window.addEventListener('resize', () => { resize(); draw(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);

  function loop(ts) {
    if (st.playing) {
      if (st.last) { st.acc += (ts - st.last) / 1000 * D.fps * st.speed; const adv = Math.floor(st.acc); if (adv > 0) { st.acc -= adv; st.frame = (st.frame + adv) % D.nFrames; draw(); } }
      st.last = ts;
    }
    requestAnimationFrame(loop);
  }

  if (CINE && CINE.aspect) { cv.style.aspectRatio = String(CINE.aspect); window.__aspect = CINE.aspect; }
  resize(); buildCine(); buildTicks(); buildFindings(); setPlaying(st.playing); draw();
  window.__renderFrame = (f) => { st.frame = clamp(Math.round(f), 0, D.nFrames - 1); draw(); };   // for tools/render_video.js (one page load, many frames)
  loadSheets().then(() => { draw(); window.__ready = true; requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
